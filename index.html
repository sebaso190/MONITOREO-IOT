<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Eléctrico IoT</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f4f9; padding: 20px; margin: 0; }
        .tabs { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; background: #ddd; border: none; border-radius: 5px; font-weight: bold; }
        .tab-btn.active { background: #007bff; color: white; }
        .view { display: none; }
        .view.active { display: block; }
        
        /* Tarjetas Tiempo Real */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .valor { font-size: 2em; font-weight: bold; color: #007bff; margin: 10px 0; }
        .unidad { font-size: 0.9em; color: #666; }
        .status { text-align: center; margin-bottom: 20px; color: #28a745; font-weight: bold; }
        
        /* Tabla Histórico */
        .table-container { max-width: 1000px; margin: 0 auto; overflow-x: auto; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #333; }
    </style>
</head>
<body>

    <h1 style="text-align: center;">Monitor de Energía IoT</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('realtime')">Tiempo Real</button>
        <button class="tab-btn" onclick="switchTab('history')">Historial de Lecturas</button>
    </div>

    <div id="conexion-status" class="status">Conectando a la base de datos...</div>

    <!-- Vista Tiempo Real -->
    <div id="realtime" class="view active">
        <div class="grid">
            <div class="card"><h3>Voltaje</h3><div class="valor" id="val-voltaje">0</div><div class="unidad">Voltios (V)</div></div>
            <div class="card"><h3>Corriente</h3><div class="valor" id="val-corriente">0</div><div class="unidad">Amperios (A)</div></div>
            <div class="card"><h3>Potencia</h3><div class="valor" id="val-potencia">0</div><div class="unidad">Vatios (W)</div></div>
            <div class="card"><h3>Energía</h3><div class="valor" id="val-energia">0</div><div class="unidad">kWh</div></div>
            <div class="card"><h3>Frecuencia</h3><div class="valor" id="val-frecuencia">0</div><div class="unidad">Hz</div></div>
            <div class="card"><h3>Factor Potencia</h3><div class="valor" id="val-pf">0</div><div class="unidad">PF</div></div>
        </div>
    </div>

    <!-- Vista Historial -->
    <div id="history" class="view">
        <div class="table-container">
            <table id="tabla-historico">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Voltaje (V)</th>
                        <th>Corriente (A)</th>
                        <th>Potencia (W)</th>
                        <th>Energía (kWh)</th>
                        <th>Frec. (Hz)</th>
                        <th>FP</th>
                    </tr>
                </thead>
                <tbody id="tabla-body">
                    <!-- Las filas se insertarán aquí por JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://jhhwfpdirkqknuepqpzv.supabase.co';
        // Esta clave pública es correcta para la web
        const SUPABASE_KEY = 'sb_publishable_bWL26c7cp7NEhc_6odLRKg_4inoIAuM';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const statusDiv = document.getElementById('conexion-status');

        // --- Control de Pestañas ---
        function switchTab(tabId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // --- Renderizar una fila en la tabla ---
        function crearFila(datos, prepend = false) {
            const tbody = document.getElementById('tabla-body');
            const fechaObj = new Date(datos.created_at);
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td>${fechaObj.toLocaleDateString()}</td>
                <td>${fechaObj.toLocaleTimeString()}</td>
                <td>${datos.voltaje}</td>
                <td>${datos.corriente}</td>
                <td>${datos.potencia}</td>
                <td>${datos.energia}</td>
                <td>${datos.frecuencia}</td>
                <td>${datos.factor_potencia}</td>
            `;
            if(prepend) {
                tbody.prepend(fila); // Insertar arriba si es un dato nuevo
            } else {
                tbody.appendChild(fila); // Insertar abajo al cargar histórico
            }
        }

        // --- Cargar Historial Inicial (Últimas 50 mediciones) ---
        async function cargarHistorial() {
            const { data, error } = await supabaseClient
                .from('mediciones')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(50);
            
            if (data) {
                data.forEach(medicion => crearFila(medicion));
            }
        }

        // --- Suscripción a Tiempo Real ---
        function actualizarUI(payload) {
            const datos = payload.new;
            // Actualizar tarjetas
            document.getElementById('val-voltaje').innerText = datos.voltaje;
            document.getElementById('val-corriente').innerText = datos.corriente;
            document.getElementById('val-potencia').innerText = datos.potencia;
            document.getElementById('val-energia').innerText = datos.energia;
            document.getElementById('val-frecuencia').innerText = datos.frecuencia;
            document.getElementById('val-pf').innerText = datos.factor_potencia;
            
            // Agregar el nuevo dato a la tabla histórica inmediatamente
            crearFila(datos, true);
            
            statusDiv.innerText = "Última actualización: " + new Date().toLocaleTimeString();
        }

        const subscription = supabaseClient
            .channel('mediciones-channel')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mediciones' }, payload => {
                actualizarUI(payload);
            })
            .subscribe((status) => {
                if(status === 'SUBSCRIBED') {
                    statusDiv.innerText = "Conectado. Recibiendo datos cada 5 segundos...";
                }
            });

        // Iniciar la carga de la tabla al abrir la página
        cargarHistorial();
    </script>
</body>
</html>
